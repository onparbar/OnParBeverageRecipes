name: Recover dashboard current release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onpar-production-deploy
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect and recover current dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$(id -un)" = onpar ]
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:$PATH"
          service_dir=/Users/onpar/OnParBeverageRecipes-service
          source "$service_dir/.deploy/pm2-release-common.sh"
          pm2_bin="$(onpar_pm2_find_binary)"
          node_bin="$(onpar_pm2_select_node22 /Users/onpar/OnParBeverageRecipes-source "$service_dir")"
          "$pm2_bin" list
          onpar_pm2_app_info "$pm2_bin" "$node_bin" onpar-dashboard
          uptime
          df -h "$service_dir"
          if ! curl -fsS --max-time 15 http://127.0.0.1:3000/api/version; then
            echo "Dashboard is unresponsive; restarting the existing PM2 app."
            RUNNER_TRACKING_ID="" "$pm2_bin" restart onpar-dashboard
          fi
          for attempt in {1..12}; do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/version; then break; fi
            sleep 3
          done
          curl -fsS --max-time 15 http://127.0.0.1:3000/api/version
          curl -fsS --max-time 15 'http://127.0.0.1:3000/api/health?storage=1'
          curl -fsS --max-time 20 -o /dev/null -w 'Public login HTTP %{http_code}\n' https://onparbev.com/login
