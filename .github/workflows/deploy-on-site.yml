name: Recover dashboard current release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onpar-production-deploy
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect and recover current dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$(id -un)" = onpar ]
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:$PATH"
          service_dir=/Users/onpar/OnParBeverageRecipes-service
          source "$service_dir/.deploy/pm2-release-common.sh"
          pm2_bin="$(onpar_pm2_find_binary)"
          node_bin="$(onpar_pm2_select_node22 /Users/onpar/OnParBeverageRecipes-source "$service_dir")"
          "$pm2_bin" list
          onpar_pm2_app_info "$pm2_bin" "$node_bin" onpar-dashboard
          uptime
          df -h "$service_dir"
          echo "Restarting the existing Cloudflare tunnel service after error 1033."
          sudo -n launchctl kickstart -k system/com.cloudflare.cloudflared
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 -o /dev/null -w 'Public login HTTP %{http_code}\n' https://onparbev.com/login; then exit 0; fi
            sleep 3
          done
          exit 1
