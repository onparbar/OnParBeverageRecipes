name: Run par agent check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onpar-production-deploy
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 3
    environment: production
    steps:
      - name: Install the deployed guarded scheduler definition without running the agent
        shell: bash
        run: |
          set -Eeuo pipefail
          helper=/Users/onpar/OnParBeverageRecipes-service/current/scripts/install-par-agent-daemon.sh
          if [ "$(id -un)" != onpar ] || [ ! -f "$helper" ]; then
            echo 'Expected on-site installer is unavailable.' >&2
            exit 1
          fi
          if ! sudo -n -l /bin/bash "$helper" >/dev/null 2>&1; then
            echo 'SCHEDULER_REPAIR_REQUIRES_MAC_ADMIN_APPROVAL. No scheduler or order data changed.' >&2
            exit 1
          fi
          sudo -n /bin/bash "$helper"
