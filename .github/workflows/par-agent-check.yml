{
  "name": "Run par agent check",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "onpar-production-deploy",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnostic": {
      "runs-on": [
        "self-hosted",
        "onpar-production"
      ],
      "timeout-minutes": 3,
      "environment": "production",
      "steps": [
        {
          "name": "Read PMB report navigation only",
          "shell": "bash",
          "run": "set -euo pipefail\nexport PATH=\"/opt/homebrew/opt/node@22/bin:/usr/local/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\"\nnode --input-type=module <<'PMB_READ_ONLY'\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { pathToFileURL } from 'node:url';\nimport { setTimeout as delay } from 'node:timers/promises';\nprocess.chdir('/Users/onpar/OnParBeverageRecipes-service/current');\nprocess.loadEnvFile('.env.local');\nconst dir=fs.mkdtempSync(path.join(os.tmpdir(),'pmb-history-readonly-'));\nfs.copyFileSync('lib/pmb-keg-timestamps.mjs',path.join(dir,'pmb-keg-timestamps.mjs'));\nfs.writeFileSync(path.join(dir,'pmb-tap-config.mjs'),fs.readFileSync('lib/pmb-tap-config.mjs','utf8')+'\\nexport { getDigestPage };\\n');\ntry {\n const {getDigestPage,parseTapConfigRows}=await import(pathToFileURL(path.join(dir,'pmb-tap-config.mjs')));\n const {parsePmbKegTimestamps}=await import(pathToFileURL(path.join(dir,'pmb-keg-timestamps.mjs')));\n const config={baseUrl:process.env.PMB_API_BASE_URL,username:process.env.PMB_API_USERNAME,password:process.env.PMB_API_PASSWORD};\n const cookieJar=new Map();\n async function read(url){let result;for(let attempt=1;attempt<=3;attempt++){result=await getDigestPage(config,url,{timeoutMs:10000,cookieJar});console.log(JSON.stringify({page:url,attempt,status:result.status,error:result.status===200?'':String(result.raw).slice(0,140)}));if(result.status===200)return result;await delay(500);}return result;}\n const configPage=await read('/pages/tapconfig');\n const reportPage=await read('/pages/keglevel');\n const slots=configPage.status===200?parseTapConfigRows(configPage.raw).filter(s=>!s.unused):[];\n const records=reportPage.status===200?parsePmbKegTimestamps(reportPage.raw):[];\n const norm=s=>String(s||'').replace(/’/g,\"'\").replace(/\\s+/g,' ').trim().toLowerCase();\n const match=s=>records.find(r=>r.deviceId===Number(s.deviceId)&&r.lineNum===Number(s.lineNum)&&r.tapNumber===Number(s.tapNumber)&&norm(r.name)===norm(s.product));\n console.log(JSON.stringify({configuredSlots:slots.length,historyRows:records.length,matchedTimestamps:slots.filter(match).length,mismatches:slots.filter(s=>!match(s)).map(s=>({tap:s.tapNumber,name:s.product,historyName:records.find(r=>r.deviceId===s.deviceId&&r.lineNum===s.lineNum)?.name})),michelob:slots.filter(s=>/michelob/i.test(s.product)).map(s=>({tap:s.tapNumber,name:s.product,tappedOn:match(s)?.tappedOn}))}));\n const {readPmbLevelSnapshot}=await import(pathToFileURL(path.resolve('lib/pmb-level-snapshot-store.mjs')));\n const snapshot=await readPmbLevelSnapshot();\n console.log(JSON.stringify({savedAt:snapshot?.updatedAt,savedHistoryCount:snapshot?.items?.filter(r=>r.tappedOn).length,savedMichelob:snapshot?.items?.filter(r=>/michelob/i.test(r.name)).map(r=>({tap:r.tapNumber,name:r.name,tappedOn:r.tappedOn}))}));\n} finally {fs.rmSync(dir,{recursive:true,force:true});}\n\nPMB_READ_ONLY\n"
        }
      ]
    }
  }
}