name: Run par agent check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onpar-production-deploy
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 3
    environment: production
    steps:
      - name: Compare legacy and deployed storage readers without changing data
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/usr/local/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
          root=/Users/onpar/OnParBeverageRecipes-service
          cd "$root/current"
          node --env-file=.env.local --input-type=module <<'NODE'
          import {pathToFileURL} from 'node:url';
          const root='/Users/onpar/OnParBeverageRecipes-service';
          for(const [label,dir] of [['deployed',root+'/current'],['legacy',root]]) {
            try {const m=await import(pathToFileURL(dir+'/lib/shared-dashboard-store.mjs'));const s=await m.readSharedDashboardState();console.log(JSON.stringify({label,ok:true,initialized:s.initialized,revision:s.revision,fieldGroups:Object.keys(s.data||{})}));}
            catch(e){console.log(JSON.stringify({label,ok:false,code:e.code||e.name,message:String(e.message).replace(/https?:\/\/\S+/g,'[URL]').slice(0,240)}));if(label==='deployed') process.exitCode=1;}
          }
          NODE
          if sudo -n -l /bin/bash "$root/current/scripts/install-par-agent-daemon.sh" >/dev/null 2>&1; then
            printf 'GUARDED_SCHEDULER_REPAIR_ALLOWED\n'
          else
            printf 'GUARDED_SCHEDULER_REPAIR_NEEDS_ADMIN_APPROVAL\n'
          fi
