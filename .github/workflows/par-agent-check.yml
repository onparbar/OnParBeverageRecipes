name: Run par agent check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 3
    environment: production
    steps:
      - name: Read production storage readiness without changing data
        shell: bash
        run: |
          /opt/homebrew/opt/node@22/bin/node --input-type=module <<'NODE'
          process.loadEnvFile('/Users/onpar/OnParBeverageRecipes-service/.env.local');
          const { buildDashboardHealth } = await import('/Users/onpar/OnParBeverageRecipes-release-bb97e6cf8f79e61a9345d8036665f2eae1701bf9/lib/dashboard-health.mjs');
          const fetchImpl = async (url, options) => {
            const response = await fetch(url, options);
            const table = new URL(url).pathname.split('/').pop();
            console.log(JSON.stringify({resource: table, httpStatus: response.status}));
            return response;
          };
          const health = await buildDashboardHealth({storage: true, fetchImpl});
          console.log(JSON.stringify({ok: health.ok, readiness: health.readiness, storage: health.reachability.supabase}));
          NODE
