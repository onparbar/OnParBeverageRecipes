name: Inspect weekly snapshot order archive
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onpar-production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Compare placed orders with matching saved snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$(id -un)" = onpar ]
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:$PATH"
          cd /Users/onpar/OnParBeverageRecipes-service/current
          node --env-file=.env.local --input-type=module <<'NODE'
          const {readParAgentState}=await import(process.cwd()+'/lib/par-agent.mjs');
          const {buildWeeklyOrderTracking}=await import(process.cwd()+'/lib/weekly-order-tracking.mjs');
          const {readSharedInventoryState}=await import(process.cwd()+'/lib/inventory-shared-store.mjs');
          const state=await readParAgentState();
          const tracking=buildWeeklyOrderTracking(state.recommendations);
          const inventory=await readSharedInventoryState();
          const snapshot=inventory.snapshots.find(s=>s.kegPlanSnapshot?.generatedAt===tracking.generatedAt);
          if(!snapshot)throw Error('No matching historical snapshot');
          if(snapshot.weekOf!=='2026-09-14'||tracking.vendors.length!==3||tracking.vendors.some(v=>!v.ordered))throw Error('Order scope changed');
          const {writeFile}=await import('node:fs/promises');
          await writeFile('/Users/onpar/OnParBeverageRecipes-service/data/inventory-before-order-archive-20260917.json',JSON.stringify(inventory),{mode:0o600,flag:'wx'});
          const {archiveWeeklyOrderPlacement}=await import(process.cwd()+'/lib/weekly-order-snapshot.mjs');
          for(const vendor of tracking.vendors)await archiveWeeklyOrderPlacement(state.recommendations,vendor.id,'owner');
          const after=await readSharedInventoryState();
          const archived=after.snapshots.find(s=>s.id===snapshot.id);
          if(archived.orders.length!==3)throw Error('Missing archived order');
          for(const vendor of tracking.vendors){
            const order=archived.orders.find(o=>o.vendorId===vendor.id);
            if(!order?.ordered||order.orderedAt!==vendor.orderedAt||order.orderedBy!==vendor.orderedBy||!order.lines.length)throw Error('Placement mismatch');
          }
          const stripOrders=snapshots=>snapshots.map(({orders,...s})=>s);
          if(JSON.stringify(stripOrders(inventory.snapshots))!==JSON.stringify(stripOrders(after.snapshots)))throw Error('Saved count details changed');
          for(const key of Object.keys(inventory.current).filter(k=>!['updatedAt','updatedByRole'].includes(k)))if(JSON.stringify(inventory.current[key])!==JSON.stringify(after.current[key]))throw Error('Live inventory changed: '+key);
          const finalPlan=await readParAgentState();
          if(JSON.stringify(state.recommendations)!==JSON.stringify(finalPlan.recommendations))throw Error('Weekly plan changed');
          console.log(JSON.stringify({verified:true,weekOf:archived.weekOf,orders:archived.orders.map(o=>({vendor:o.vendor,orderedAt:o.orderedAt,lines:o.lines.length})),inventoryUnchanged:true,weeklyPlanUnchanged:true}));
          NODE
