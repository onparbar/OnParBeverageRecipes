name: Recover dashboard current release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onpar-production-deploy
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, onpar-production]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect and recover current dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$(id -un)" = onpar ]
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:$PATH"
          service_dir=/Users/onpar/OnParBeverageRecipes-service
          source "$service_dir/.deploy/pm2-release-common.sh"
          pm2_bin="$(onpar_pm2_find_binary)"
          node_bin="$(onpar_pm2_select_node22 /Users/onpar/OnParBeverageRecipes-source "$service_dir")"
          "$pm2_bin" list
          onpar_pm2_app_info "$pm2_bin" "$node_bin" onpar-dashboard
          uptime
          df -h "$service_dir"
          pgrep -x cloudflared || true
          launchctl list | grep -i cloudflare || true
          for folder in /Library/LaunchDaemons /Library/LaunchAgents "$HOME/Library/LaunchAgents"; do
            find "$folder" -maxdepth 1 -iname '*cloudfl*' -print 2>/dev/null || true
          done
          ls -lt "$HOME/.cloudflared"/*.log /var/log/*cloudfl* /tmp/*cloudfl*.log 2>/dev/null || true
          curl -sS --max-time 20 -D - https://onparbev.com/login | head -c 1500
