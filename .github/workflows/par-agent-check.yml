{
  "name": "Run par agent check",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "onpar-production-deploy",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnostic": {
      "runs-on": [
        "self-hosted",
        "onpar-production"
      ],
      "timeout-minutes": 3,
      "environment": "production",
      "steps": [
        {
          "name": "Read PMB report navigation only",
          "shell": "bash",
          "run": "set -euo pipefail\nexport PATH=\"/opt/homebrew/opt/node@22/bin:/usr/local/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\"\nnode --input-type=module <<'PMB_READ_ONLY'\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { pathToFileURL } from 'node:url';\nprocess.chdir('/Users/onpar/OnParBeverageRecipes-service/current');\nprocess.loadEnvFile('.env.local');\nconst file=path.join(os.tmpdir(),'pmb-readonly-'+process.pid+'.mjs');\nfs.writeFileSync(file,fs.readFileSync('lib/pmb-tap-config.mjs','utf8')+'\\nexport { getDigestPage };\\n');\ntry {\n const {getDigestPage}=await import(pathToFileURL(file));\n const config={baseUrl:process.env.PMB_API_BASE_URL,username:process.env.PMB_API_USERNAME,password:process.env.PMB_API_PASSWORD};\n const clean=s=>s.replace(/<[^>]*>/g,' ').replace(/\\s+/g,' ').trim();\n for(const requestPath of ['/pages/keglevel']) {\n  const page=await getDigestPage(config,requestPath,{timeoutMs:10000});\n  const html=page.raw||'';\n  const links=[...html.matchAll(/<a\\b[^>]*href=[\"']([^\"']+)[\"'][^>]*>([\\s\\S]*?)<\\/a>/gi)].map(m=>({path:m[1],label:clean(m[2])})).filter(x=>/keg|report|management|history/i.test(x.path+' '+x.label));\n  const scripts=[...html.matchAll(/<script\\b[^>]*src=[\"']([^\"']+)[\"']/gi)].map(m=>m[1]);\n  const matches=[...html.matchAll(/Michelob/gi)].map(m=>html.slice(Math.max(0,m.index-850),m.index+1300)).slice(0,5);\n  console.log(JSON.stringify({page:requestPath,status:page.status,michelobMarkup:matches}));\n }\n} finally {fs.unlinkSync(file);}\n\nPMB_READ_ONLY\n"
        }
      ]
    }
  }
}