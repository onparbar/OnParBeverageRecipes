{
  "name": "Run par agent check",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "onpar-production-deploy",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnostic": {
      "runs-on": [
        "self-hosted",
        "onpar-production"
      ],
      "timeout-minutes": 3,
      "environment": "production",
      "steps": [
        {
          "name": "Read PMB report navigation only",
          "shell": "bash",
          "run": "set -euo pipefail\nexport PATH=\"/opt/homebrew/opt/node@22/bin:/usr/local/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\"\nnode --input-type=module <<'PMB_READ_ONLY'\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { pathToFileURL } from 'node:url';\nprocess.chdir('/Users/onpar/OnParBeverageRecipes-service/current');\nprocess.loadEnvFile('.env.local');\nconst dir=fs.mkdtempSync(path.join(os.tmpdir(),'pmb-history-readonly-'));\nfs.copyFileSync('lib/pmb-keg-timestamps.mjs',path.join(dir,'pmb-keg-timestamps.mjs'));\nfs.writeFileSync(path.join(dir,'pmb-tap-config.mjs'),fs.readFileSync('lib/pmb-tap-config.mjs','utf8')+'\\nexport { getDigestPage };\\n');\ntry {\n const {getDigestPage,getTapConfigRows}=await import(pathToFileURL(path.join(dir,'pmb-tap-config.mjs')));\n const {parsePmbKegTimestamps}=await import(pathToFileURL(path.join(dir,'pmb-keg-timestamps.mjs')));\n const config={baseUrl:process.env.PMB_API_BASE_URL,username:process.env.PMB_API_USERNAME,password:process.env.PMB_API_PASSWORD};\n const page=await getDigestPage(config,'/pages/keglevel',{timeoutMs:5000});\n const html=page.raw||'';\n const records=parsePmbKegTimestamps(html);\n const cards=[...html.matchAll(/<article\\b[^>]*>([\\s\\S]*?)<\\/article>/gi)].map(m=>m[1]);\n const plain=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/\\s+/g,' ').trim();\n console.log(JSON.stringify({reportStatus:page.status,reportLength:html.length,cardCount:cards.length,timestampLabels:(html.match(/tapped on:/gi)||[]).length,parsedCount:records.length,sampleCards:cards.filter(s=>/Michelob/i.test(s)).map(s=>({text:plain(s).slice(0,650),paragraphs:[...s.matchAll(/<p\\b[^>]*>[\\s\\S]*?<\\/p>/gi)].map(m=>m[0]).slice(0,6)})).slice(0,2),error:page.status===200?'':plain(html).slice(0,160)}));\n if(records.length){const slots=await getTapConfigRows(config);const norm=s=>String(s||'').replace(/’/g,\"'\").replace(/\\s+/g,' ').trim().toLowerCase();const matched=slots.filter(s=>records.some(r=>r.deviceId===Number(s.deviceId)&&r.lineNum===Number(s.lineNum)&&r.tapNumber===Number(s.tapNumber)&&norm(r.name)===norm(s.product)));console.log(JSON.stringify({configuredSlots:slots.length,matchedTimestamps:matched.length,michelobSlots:slots.filter(s=>/Michelob/i.test(s.product)).map(s=>({tapNumber:s.tapNumber,product:s.product,history:records.find(r=>r.deviceId===Number(s.deviceId)&&r.lineNum===Number(s.lineNum))||null}))}));}\n} finally {fs.rmSync(dir,{recursive:true,force:true});}\n\nPMB_READ_ONLY\n"
        }
      ]
    }
  }
}